      - '%\s*of\s+Gross\s+NPAs?\s*to\s+Gross\s+Advances'
      - 'GNPA\s*(?:Ratio|%)'
      - 'Gross\s+NPA\s+to\s+Gross\s+Advances'

  - key: nnpa_ratio
    excel_header: Net NPA Ratio %
    column: 27
