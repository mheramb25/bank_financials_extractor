# =============================================================================
# arx/metrics.yaml -- THE metric dictionary. Data, not code.
#
# NOTE ON THE COUNT: the column band spec in the template gives
#   Headline 8 + P&L 12 + Asset Quality 10 + Capital 10 + Strategic/ESG 11
#   + Technology 1 = 52 metric columns (spreadsheet columns 4..55).
# The brief calls this "55 metrics"; the authoritative source is the column
# list, so there are 52 entries below, in exactly template column order.
# Add/remove entries here and the pipeline + Excel writer follow automatically.
#
# Fields
#   key            : stable internal id (used by formulas.py, dna.py)
#   excel_header   : must match the template's row-2 header EXACTLY
#   column         : 1-based spreadsheet column (belt & braces; header wins)
#   group          : row-1 band
#   aliases        : regex list, case-insensitive, tried in order
#   unit_type      : currency | percent | ratio | count | text
#   applicable_to  : list of institution types: bank, sfb, nbfc, hfc, aifi
#   tier           : A | B | C  (evidence requirement, Stage 14)
#   sane_range     : [min, max] AFTER normalisation (currency = Rs. crore)
#   derivable_from : formula id in formulas.py (optional)
#   allow_negative : default false
# =============================================================================

metrics:

  # ---------------------------- HEADLINE SIZE -----------------------------
  - key: total_assets
    excel_header: Total Assets
    column: 4
    group: Headline Size
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [100, 90000000]
    aliases:
      - 'Total\s+Assets'
      - 'TOTAL\s+ASSETS'
      - 'Total\s+of\s+Assets'
      - 'Balance\s+Sheet\s+Size'
      - 'Total\s+Assets\s*\(Rs\.?\s*in\s*crore\)'

  - key: total_deposits
    excel_header: Total Deposits
    column: 5
    group: Headline Size
    unit_type: currency
    applicable_to: [bank, sfb]
    tier: A
    sane_range: [10, 60000000]
    aliases:
      - 'Total\s+Deposits'
      - '^Deposits$'
      - 'Deposits\s*\(Schedule\s*3\)'
      - 'Customer\s+Deposits'
      - 'Aggregate\s+Deposits'

  - key: gross_advances
    excel_header: Total Advances (Gross)
    column: 6
    group: Headline Size
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [10, 60000000]
    aliases:
      - 'Gross\s+Advances'
      - 'Total\s+Advances'
      - 'Gross\s+Loans?\s*(?:and\s+Advances)?'
      - 'Advances\s*\(Gross\)'
      - 'Gross\s+Loan\s+Book'
      - 'Gross\s+Credit\s+Exposure'
      - '^Advances$'

  - key: aum
    excel_header: Assets Under Management (AUM)
    column: 7
    group: Headline Size
    unit_type: currency
    applicable_to: [nbfc, hfc, aifi]
    tier: B
    sane_range: [1, 30000000]
    aliases:
      - 'Assets?\s+Under\s+Management'
      - '\bAUM\b'
      - 'Loan\s+Assets\s+Under\s+Management'
      - 'Managed\s+Assets'

  - key: market_cap
    excel_header: Market Capitalization
    column: 8
    group: Headline Size
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc]
    tier: C
    sane_range: [1, 3000000]
    aliases:
      - 'Market\s+Capitali[sz]ation'
      - 'Market\s+Cap\b'
      - 'Mcap\b'

  - key: branches
    excel_header: Total Branches
    column: 9
    group: Headline Size
    unit_type: count
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [1, 30000]
    aliases:
      - 'Number\s+of\s+Branches'
      - 'Total\s+Branches'
      - 'Branch\s+Network'
      - 'Branches\s*(?:as\s+(?:on|at))?'
      - 'No\.?\s*of\s+Branches'

  - key: employees
    excel_header: Total Employee Count
    column: 10
    group: Headline Size
    unit_type: count
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [10, 400000]
    aliases:
      - 'Number\s+of\s+Employees'
      - 'Total\s+Employees'
      - 'Employee\s+Strength'
      - 'Total\s+Headcount'
      - 'No\.?\s*of\s+Employees'
      - 'Permanent\s+Employees'

  - key: customers
    excel_header: Total Customer Base (Numbers)
    column: 11
    group: Headline Size
    unit_type: count
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: C
    sane_range: [10000, 1000000000]
    aliases:
      - 'Customer\s+Base'
      - 'Total\s+Customers'
      - 'Number\s+of\s+Customers'
      - 'Customers\s+Served'

  # ---------------------------- PROFIT & LOSS -----------------------------
  - key: interest_earned
    excel_header: Interest Earned
    column: 12
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [1, 5000000]
    aliases:
      - 'Interest\s+Earned'
      - 'Interest\s+Income'
      - 'Total\s+Interest\s+Income'
      - 'Interest\s+earned\s*\(Schedule\s*13\)'
      - 'Revenue\s+from\s+Operations\s*-\s*Interest'

  - key: interest_expended
    excel_header: Interest Expended
    column: 13
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [1, 5000000]
    aliases:
      - 'Interest\s+Expended'
      - 'Interest\s+Expense[sd]?'
      - 'Finance\s+Cost[s]?'
      - 'Interest\s+expended\s*\(Schedule\s*15\)'
      - 'Total\s+Interest\s+Expense'

  - key: nii
    excel_header: Net Interest Income (NII)
    column: 14
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [-100000, 3000000]
    allow_negative: true
    derivable_from: nii_identity
    aliases:
      - 'Net\s+Interest\s+Income'
      - '\bNII\b'
      - 'Interest\s+Income\s*\(net\)'
      - 'Net\s+Interest\s+Earnings'

  - key: other_income
    excel_header: Other Income (Non-Interest)
    column: 15
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [-50000, 2000000]
    allow_negative: true
    aliases:
      - 'Other\s+Income'
      - 'Non[-\s]?Interest\s+Income'
      - 'Fee\s+and\s+Other\s+Income'
      - 'Other\s+income\s*\(Schedule\s*14\)'

  - key: opex
    excel_header: Operating Expenses
    column: 16
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [1, 2000000]
    aliases:
      - 'Operating\s+Expenses'
      - 'Total\s+Operating\s+Expenses'
      - 'Operating\s+Costs?'
      - 'Operating\s+expenses\s*\(Schedule\s*16\)'
      - 'Non[-\s]?Interest\s+Expense'

  - key: employee_costs
    excel_header: Employee Costs
    column: 17
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [0.1, 500000]
    aliases:
      - 'Payments?\s+to\s+and\s+Provisions?\s+for\s+Employees'
      - 'Employee\s+Costs?'
      - 'Employee\s+Benefits?\s+Expenses?'
      - 'Staff\s+Costs?'
      - 'Personnel\s+Expenses'

  - key: total_provisions
    excel_header: Total Provisions
    column: 18
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [-100000, 1000000]
