      - 'Yield\s+on\s+Dividend'

  - key: credit_rating
    excel_header: Credit Rating (Long Term)
    column: 43
    group: Capital & Solvency
    unit_type: text
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
