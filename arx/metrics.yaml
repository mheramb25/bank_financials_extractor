# -----------------------------------------------------------------------------
# Banking-logic rules (Stage 9, Level 2). Evaluated only when BOTH sides exist.
#   op: gt | gte | lt | lte | approx_sum | positive
# -----------------------------------------------------------------------------
banking_rules:
  - id: gnpa_gt_nnpa
    left: gnpa_amount
    op: gte
    right: nnpa_amount
    message: "Gross NPA must be >= Net NPA"
  - id: gnpa_ratio_gt_nnpa_ratio
    left: gnpa_ratio
    op: gte
    right: nnpa_ratio
    message: "Gross NPA % must be >= Net NPA %"
  - id: roe_gt_roa
    left: roe
    op: gte
    right: roa
    message: "RoE must be >= RoA (leverage is >= 1x)"
  - id: car_gt_cet1
    left: crar
    op: gte
    right: cet1
    message: "Total CRAR must be >= CET1"
  - id: car_gt_tier1
    left: crar
    op: gte
    right: tier1
    message: "Total CRAR must be >= Tier 1"
  - id: assets_gt_advances
    left: total_assets
    op: gt
    right: gross_advances
    message: "Total Assets must exceed Gross Advances"
  - id: assets_gt_deposits
    left: total_assets
    op: gt
    right: total_deposits
    message: "Total Assets must exceed Total Deposits"
  - id: pcr_under_100
    left: pcr
    op: lte
    right: 100
    message: "PCR cannot exceed 100%"
  - id: tier_sum_is_crar
    left: [tier1, tier2]
    op: approx_sum
    right: crar
    tolerance: 0.30
    message: "Tier 1 + Tier 2 must be approximately equal to CRAR"
  - id: interest_earned_gt_expended
    left: interest_earned
    op: gt
    right: interest_expended
    message: "Interest Earned normally exceeds Interest Expended"
    severity: soft
  - id: net_worth_positive
    left: net_worth
    op: positive
    message: "Net Worth must be positive"
