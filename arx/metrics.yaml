      - 'Provisioning\s+Coverage\s+Ratio'

  - key: slippage_ratio
    excel_header: Slippage Ratio %
    column: 29
    group: Asset Quality
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: C
    sane_range: [0, 20]
    aliases:
      - 'Slippage\s+Ratio'
      - 'Gross\s+Slippage\s+Ratio'
      - 'Fresh\s+Slippage\s+Ratio'

  - key: write_offs
    excel_header: Write-offs During Year
    column: 30
    group: Asset Quality
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: C
    sane_range: [0, 500000]
    aliases:
      - 'Write[-\s]?offs?\s+during\s+the\s+year'
      - 'Technical\s*/?\s*Prudential\s+Write[-\s]?offs?'
      - 'Amounts?\s+Written\s+off'
      - 'Bad\s+Debts\s+Written\s+Off'

  - key: stage3_pct
    excel_header: Stage 3 Assets % (NBFC)
    column: 31
    group: Asset Quality
    unit_type: percent
    applicable_to: [nbfc, hfc]
    tier: C
    sane_range: [0, 40]
    aliases:
      - 'Stage\s*3\s*(?:Assets|Loans)?\s*(?:Ratio|%|\(%\))?'
      - 'Gross\s+Stage\s*3'
      - 'Stage\s*III\s*Assets'

  - key: standard_assets_provision
    excel_header: Standard Assets Provision
    column: 32
    group: Asset Quality
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: C
    sane_range: [0, 200000]
    aliases:
      - 'Provision\s+(?:for|on)\s+Standard\s+Assets'
      - 'Standard\s+Assets?\s+Provision'
      - 'General\s+Provision\s+on\s+Standard\s+Assets'

  - key: credit_cost
    excel_header: Credit Cost %
    column: 33
    group: Asset Quality
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: C
    sane_range: [-2, 15]
    allow_negative: true
    aliases:
