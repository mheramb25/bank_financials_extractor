    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [0, 25]
    aliases:
      - 'Net\s+NPA\s*(?:Ratio|%|\(%\))'
      - '%\s*of\s+Net\s+NPAs?\s*to\s+Net\s+Advances'
      - 'NNPA\s*(?:Ratio|%)'

  - key: pcr
    excel_header: Provision Coverage Ratio (PCR) %
    column: 28
    group: Asset Quality
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [0, 100]
    derivable_from: pcr_identity
    aliases:
