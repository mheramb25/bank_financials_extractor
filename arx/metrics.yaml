      - 'Total\s+Provisions'
      - 'Impairment\s+on\s+Financial\s+Instruments'
      - 'Provisions?\s*\(other\s+than\s+tax\)'
      - 'Expected\s+Credit\s+Loss'

  - key: pat
    excel_header: Profit After Tax (PAT)
    column: 19
    group: Profit & Loss
    unit_type: currency
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [-200000, 1000000]
    allow_negative: true
    aliases:
      - 'Profit\s+After\s+Tax'
      - 'Net\s+Profit\s+for\s+the\s+(?:Year|Period)'
      - 'Profit\s+for\s+the\s+(?:Year|Period)'
      - '\bPAT\b'
      - 'Net\s+Profit'

  - key: nim
    excel_header: Net Interest Margin (NIM) %
    column: 20
    group: Profit & Loss
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: B
    sane_range: [0, 15]
    aliases:
      - 'Net\s+Interest\s+Margin'
      - '\bNIM\b'
      - 'Margin\s*\(NIM\)'

  - key: roa
    excel_header: Return on Assets (RoA) %
    column: 21
    group: Profit & Loss
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [-5, 5]
    allow_negative: true
    derivable_from: roa_identity
    aliases:
      - 'Return\s+on\s+(?:Average\s+)?Assets'
      - '\bRoA\b'
      - '\bROA\b'

  - key: roe
    excel_header: Return on Equity (RoE) %
    column: 22
    group: Profit & Loss
    unit_type: percent
    applicable_to: [bank, sfb, nbfc, hfc, aifi]
    tier: A
    sane_range: [-50, 50]
    allow_negative: true
    derivable_from: roe_identity
    aliases:
      - 'Return\s+on\s+Equity'
      - 'Return\s+on\s+Net\s+Worth'
      - '\bRoE\b'
      - '\bROE\b'
