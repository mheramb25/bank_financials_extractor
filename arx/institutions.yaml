# =============================================================================
# arx/institutions.yaml -- alias table for institution identification (Stage 2)
#
#   canonical : the name written into Excel column C (must match the template)
#   category  : written into Excel column B when a NEW row is appended
#   type      : bank | sfb | nbfc | hfc | aifi  -> drives `applicable_to`
#   aliases   : plain strings, matched case/punctuation-insensitively and fuzzily
#   cin       : optional Corporate Identity Number (a very strong signal)
#   ticker    : optional NSE ticker
#
# `the Bank` / `the Company` are deliberately NOT aliases: they are generic and
# would match every report. They are used only as *self-reference* confirmations
# once a canonical name has already been established from the cover page.
# =============================================================================

default_category_by_type:
  bank: Private Sector Bank
  sfb: Small Finance Bank
  nbfc: NBFC
  hfc: Housing Finance Company
  aifi: All-India Financial Institution

